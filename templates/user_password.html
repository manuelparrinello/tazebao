{% extends "base.html" %}

{% block title %}Reset password{% endblock %}

{% block content %}
<div class="erp-form-page">
    <div class="erp-form-header d-flex flex-column flex-md-row justify-content-between align-items-md-end gap-2">
        <div>
            <h3 class="fw-bolder erp-form-title mb-1">Modifica password</h3>
            <p class="erp-form-subtitle mb-0">{{ user.name or user.email }}</p>
        </div>
        <a href="{{ url_for('users.users_index') }}" class="btn btn-outline-secondary">
            <i class="bi bi-arrow-left"></i>&nbsp;Torna agli utenti
        </a>
    </div>

    <form action="{{ url_for('users.users_password', user_id=user.id) }}" method="post" class="erp-boxed-form">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="card erp-form-card">
            <div class="card-body p-3 p-md-4">
            <div class="erp-form-section">
                <div class="erp-form-section-heading">
                    <h5>Nuova password</h5>
                    <p>Imposta e conferma la nuova password dell'utente.</p>
                </div>
                <div class="row g-3">
                    <div class="col-12 col-md-6">
                        <label class="form-label fw-bold" for="password">Nuova password</label>
                        <input type="password" class="form-control" id="password" name="password" required>
                    </div>
                    <div class="col-12 col-md-6">
                        <label class="form-label fw-bold" for="password_confirm">Conferma password</label>
                        <input type="password" class="form-control" id="password_confirm" name="password_confirm" required>
                    </div>
                </div>
            </div>

            <div class="erp-form-footer-actions">
                <button type="submit" class="btn btn-primary">
                    <i class="bi bi-key"></i>&nbsp;Aggiorna password
                </button>
                <a href="{{ url_for('users.users_index') }}" class="btn btn-outline-secondary"><i class="bi bi-x-lg"></i>&nbsp;Annulla</a>
            </div>
            </div>
        </div>
    </form>
</div>
{% endblock %}
