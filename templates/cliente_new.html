{% extends "base.html" %}

{% block title %}Nuovo Cliente{% endblock %}

{% block content %}
<div id="formCliente" class="erp-form-page" v-cloak>
    <div class="erp-form-header">
        <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-end gap-2">
            <div>
                <h3 class="fw-bolder erp-form-title">Nuovo cliente</h3>
                <p class="erp-form-subtitle">Compila il modulo sottostante per aggiungere un nuovo cliente.</p>
            </div>
            <a href="{{ url_for('clienti') }}" class="btn btn-outline-secondary">
                <i class="bi bi-arrow-left"></i>&nbsp;Torna ai clienti
            </a>
        </div>
    </div>

    <form id="nuovoCliente" @submit.prevent="submitFormNewCliente($event)">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="card erp-form-card">
            <div class="card-body p-3 p-md-4">
                <div class="row g-3">
                    <div class="col-12 col-md-4">
                        <label class="form-label fw-bold" for="nomeCliente">Nome</label>
                        <input style="text-transform:capitalize" name="nome" type="text" v-model="nome" class="form-control">
                    </div>
                    <div class="col-12 col-md-4">
                        <label class="form-label fw-bold" for="nomeCliente">Ragione Sociale/Intestazione</label>
                        <input style="text-transform:capitalize" name="ragsoc" type="text" v-model="ragsoc" class="form-control">
                    </div>
                    <div class="col-12 col-md-4">
                        <label class="form-label fw-bold" for="nomeCliente">Indirizzo</label>
                        <input style="text-transform:capitalize" name="indirizzo" type="text" v-model="indirizzo" class="form-control">
                    </div>
                    <div class="col-12 col-sm-6 col-md-2">
                        <label class="form-label fw-bold" for="nomeCliente">CAP</label>
                        <input maxlength="5" style="text-transform:capitalize" name="cap" type="text" v-model="cap" class="form-control">
                    </div>
                    <div class="col-12 col-sm-6 col-md-3">
                        <label class="form-label fw-bold" for="nomeCliente">Città</label>
                        <input style="text-transform:capitalize" name="citta" type="text" v-model="citta" class="form-control">
                    </div>
                    <div class="col-12 col-sm-6 col-md-2">
                        <label class="form-label fw-bold" for="nomeCliente">Provincia</label>
                        <input style="text-transform:uppercase" name="provincia" type="text" v-model="provincia" maxlength="2" class="form-control">
                    </div>
                    <div class="col-12 col-sm-6 col-md-5">
                        <label class="form-label fw-bold" for="email">Email</label>
                        <input name="email" type="email" v-model="email" class="form-control">
                    </div>
                    <div class="col-12 col-sm-6 col-md-3">
                        <label class="form-label fw-bold" for="telefono">Telefono</label>
                        <input name="telefono" type="tel" v-model="telefono" class="form-control">
                    </div>
                    <div class="col-12 col-sm-6 col-md-3">
                        <label class="form-label fw-bold" for="telefono">P.IVA/C.F</label>
                        <input name="p_iva" style="text-transform:uppercase" type="text" v-model="p_iva" class="form-control">
                    </div>
                    <div class="col-12 col-sm-6 col-md-2">
                        <label class="form-label fw-bold" for="telefono">SDI</label>
                        <input maxlength="7" name="sdi" style="text-transform:uppercase" type="text" v-model="sdi" class="form-control">
                    </div>
                    <div class="col-12 col-sm-6 col-md-4">
                        <label class="form-label fw-bold" for="telefono">PEC</label>
                        <input name="pec" type="email" v-model="pec" class="form-control">
                    </div>
                    <div class="col-12 col-sm-6 col-md-2">
                        <label class="form-label fw-bold" for="colore">Colore</label>
                        <input name="colore" type="color" v-model="colore" class="form-control form-control-color w-100" title="Scegli il colore">
                    </div>
                    <div class="col-12">
                        <label class="form-label fw-bold" for="telefono">Note</label>
                        <textarea name="note" v-model="note" class="form-control" rows="4"></textarea>
                    </div>
                </div>

                <div class="erp-form-actions mt-4">
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-floppy"></i>&nbsp;Salva cliente
                    </button>
                </div>
            </div>
        </div>
    </form>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/cliente_new.js') }}"></script>
{% endblock %}
